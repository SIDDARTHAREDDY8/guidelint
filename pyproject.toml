[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guidelint"
version = "0.1.0"
description = "Preflight linter for structured-output / constrained-decoding configs (vLLM, llama.cpp, Ollama)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "vllm", "structured-output", "constrained-decoding", "lint", "xgrammar"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
]

[project.scripts]
guidelint = "guidelint.cli:main"

[project.urls]
Homepage = "https://github.com/SIDDARTHAREDDY8/guidelint"
Issues = "https://github.com/SIDDARTHAREDDY8/guidelint/issues"

[tool.setuptools.packages.find]
where = ["src"]
